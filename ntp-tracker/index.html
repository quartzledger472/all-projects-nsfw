<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NTP Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0c10;--bg2:#111419;--bg3:#171b22;
  --teal:#6fb8ac;--teal2:#9ed8cc;
  --teal-dim:rgba(111,184,172,0.08);--teal-mid:rgba(111,184,172,0.25);
  --text:#eef1f0;--text2:#8b9490;--text3:#454c56;
  --border:rgba(255,255,255,0.06);--border2:rgba(111,184,172,0.2);
  --red:#c06868;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Jost',sans-serif;}
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;}
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity:0.035;pointer-events:none;z-index:0;
}
.back{position:fixed;top:1.1rem;left:1.25rem;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:0.14em;color:var(--text3);text-decoration:none;z-index:101;}
.back:hover{color:var(--teal);}

/* Gate */
#gate{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:2rem;text-align:center;}
.gate-glyph{font-size:40px;margin-bottom:1.25rem;opacity:0.4;color:var(--teal);}
#gate h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:400;color:var(--text);margin-bottom:0.5rem;letter-spacing:0.04em;}
#gate p{font-size:13px;color:var(--text2);line-height:1.7;max-width:300px;margin:0 auto 2rem;}
.gate-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px;}
.btn-enter{padding:14px;background:var(--teal);color:#0a0c10;border:none;font-family:'Jost',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;border-radius:1px;}
.btn-leave{padding:14px;background:transparent;color:var(--text2);border:1px solid var(--border);font-family:'Jost',sans-serif;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;border-radius:1px;}

/* App */
#app{display:none;flex-direction:column;width:100%;height:100%;max-width:520px;position:relative;z-index:1;flex:1;}
#app.show{display:flex;}

header{padding:1.25rem 1.5rem 1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
.logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:400;font-style:italic;color:var(--teal);letter-spacing:0.04em;}
.header-sub{font-size:10px;letter-spacing:0.16em;color:var(--text3);text-transform:uppercase;}

/* Search */
.search-bar{padding:1rem 1.5rem;display:flex;gap:8px;border-bottom:1px solid var(--border);flex-shrink:0;}
.search-input{
  flex:1;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);
  border-radius:2px;color:var(--text);font-family:'Jost',sans-serif;font-size:13px;
  letter-spacing:0.02em;outline:none;
}
.search-input::placeholder{color:var(--text3);}
.search-input:focus{border-color:var(--border2);}
.btn-search{
  flex-shrink:0;padding:12px 18px;background:var(--teal);color:#0a0c10;border:none;
  font-family:'Jost',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.1em;
  text-transform:uppercase;cursor:pointer;border-radius:2px;
}
.btn-search:disabled{opacity:0.5;cursor:default;}

/* Main feed area */
.main{flex:1;overflow-y:auto;padding:1.25rem 1.5rem 2rem;display:flex;flex-direction:column;}
#feed{display:flex;flex-direction:column;gap:0.75rem;}

.hint{font-size:12px;color:var(--text3);line-height:1.7;text-align:center;padding:2.5rem 1rem;}
.hint b{color:var(--teal);font-weight:500;}

.status-msg{font-size:12px;color:var(--text2);text-align:center;padding:2.5rem 1rem;letter-spacing:0.03em;}
.status-msg.error{color:var(--red);}

.profile-line{
  font-size:11px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;
  padding-bottom:0.25rem;
}
.profile-line b{color:var(--teal2);text-transform:none;letter-spacing:0.02em;font-weight:500;}

/* Comment cards */
.item{
  background:var(--bg3);border:1px solid var(--border);border-radius:3px;
  padding:0.9rem 1.1rem;display:flex;flex-direction:column;gap:0.4rem;
}
.item-top{display:flex;align-items:baseline;gap:8px;}
.item-title{
  font-size:12.5px;font-weight:500;color:var(--teal2);text-decoration:none;
  line-height:1.4;flex:1;
}
.item-title:hover{text-decoration:underline;}
.ago{font-size:10px;color:var(--text3);letter-spacing:0.04em;flex-shrink:0;white-space:nowrap;}
.item-text{font-size:13px;color:var(--text);line-height:1.55;}

.btn-load-more{
  width:100%;padding:11px;background:transparent;border:1px solid var(--border2);
  color:var(--teal2);font-family:'Jost',sans-serif;font-size:11px;font-weight:500;
  letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;border-radius:2px;margin-top:0.25rem;
}
.btn-load-more:hover{background:var(--teal-dim);}
.btn-load-more:disabled{opacity:0.5;cursor:default;}
.end-msg{font-size:10px;color:var(--text3);text-align:center;letter-spacing:0.06em;padding:0.75rem 0 0.25rem;}

/* URL box — persists independently of the comment feed re-renders */
#url-box-wrap{flex-shrink:0;padding-bottom:1rem;border-bottom:1px solid var(--border);margin-bottom:0.25rem;}
.url-box-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:0.4rem;}
.url-box-label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);}
.url-box-actions{display:flex;gap:6px;flex-shrink:0;}
.btn-mini{
  padding:5px 10px;background:transparent;border:1px solid var(--border2);color:var(--teal2);
  font-family:'Jost',sans-serif;font-size:9.5px;font-weight:500;letter-spacing:0.08em;
  text-transform:uppercase;cursor:pointer;border-radius:2px;white-space:nowrap;
}
.btn-mini:hover{background:var(--teal-dim);}
.btn-mini:disabled{opacity:0.4;cursor:default;}
#url-box{
  width:100%;min-height:84px;max-height:160px;resize:vertical;background:var(--bg2);
  border:1px solid var(--border);border-radius:2px;color:var(--text2);font-family:monospace;
  font-size:11px;line-height:1.5;padding:0.6rem 0.7rem;outline:none;
}
#url-box::placeholder{color:var(--text3);font-family:'Jost',sans-serif;}
#url-box:focus{border-color:var(--border2);}
.url-box-status{font-size:10px;color:var(--text3);margin-top:0.35rem;letter-spacing:0.03em;}

footer{
  padding:0.9rem 1.5rem 1.25rem;border-top:1px solid var(--border);flex-shrink:0;
  font-size:10px;color:var(--text3);letter-spacing:0.04em;text-align:center;line-height:1.6;
}
footer code{color:var(--teal2);font-family:monospace;}

@media (max-width:520px){
  #app{max-width:100%;}
}
</style>
</head>
<body>

<a class="back" href="../">&#9664; INDEX</a>

<div id="gate">
  <div class="gate-glyph">◈</div>
  <h1>NTP Tracker</h1>
  <p>Look up a NameThatPorn.com profile's comments. Pulls user-submitted comments from an adult trivia site — 18+.</p>
  <div class="gate-btns">
    <button class="btn-enter" id="btn-enter">I'm 18+ — Enter</button>
    <button class="btn-leave" id="btn-leave">Leave</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">NTP Tracker</div>
    <div class="header-sub">Comments</div>
  </header>

  <div class="search-bar">
    <input class="search-input" id="username-input" type="text" placeholder="NameThatPorn username" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn-search" id="btn-search">Look Up</button>
  </div>

  <div class="main">
    <div id="url-box-wrap">
      <div class="url-box-head">
        <span class="url-box-label">Comment links</span>
        <div class="url-box-actions">
          <button class="btn-mini" id="btn-load-all" disabled>Load all pages</button>
          <button class="btn-mini" id="btn-copy-urls">Copy</button>
        </div>
      </div>
      <textarea id="url-box" readonly placeholder="Links to the posts each comment lives on will appear here — one per line, ready to copy."></textarea>
      <p class="url-box-status" id="url-box-status"></p>
    </div>

    <div id="feed">
      <p class="hint">Enter a username above — e.g. <b>redcollar1275</b> — to pull their recent comments.</p>
    </div>
  </div>

  <footer id="footer-note"></footer>
</div>

<script>
// Set this to your deployed worker's URL after running `npx wrangler deploy`
// in ntp-tracker-worker/. See that folder's README.md.
const WORKER_URL = 'https://ntp-tracker-worker.quartzlegend.workers.dev';

const feedEl = document.getElementById('feed');
const inputEl = document.getElementById('username-input');
const btnEl = document.getElementById('btn-search');
const footerEl = document.getElementById('footer-note');
const urlBoxEl = document.getElementById('url-box');
const urlStatusEl = document.getElementById('url-box-status');
const btnLoadAllEl = document.getElementById('btn-load-all');
const btnCopyEl = document.getElementById('btn-copy-urls');

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderStatus(msg, isError) {
  feedEl.innerHTML = `<p class="status-msg${isError ? ' error' : ''}">${escapeHtml(msg)}</p>`;
}

// Holds everything loaded so far for the current profile so "Load more" /
// "Load all pages" can append pages without re-fetching what's already
// shown, and so the URL box (below) always reflects the same data.
let state = {
  username: '',
  page: 0,
  lastPage: null,
  comments: [],
  loadingMore: false,
  loadingAll: false,
  loadError: false,
};

function renderList() {
  const { username, comments, page, lastPage, loadingMore, loadingAll, loadError } = state;

  if (!comments.length) {
    feedEl.innerHTML =
      `<p class="profile-line">Profile: <b>${escapeHtml(username)}</b></p>` +
      `<p class="status-msg">No comments found on this page.</p>`;
    return;
  }

  const rows = comments.map((c) => `
      <div class="item">
        <div class="item-top">
          <a class="item-title" href="${escapeHtml(c.postHref || '#')}" target="_blank" rel="noopener noreferrer">${escapeHtml(c.postTitle || 'Untitled post')}</a>
          <span class="ago">${escapeHtml(c.ago || '')}</span>
        </div>
        <div class="item-text">${escapeHtml(c.text)}</div>
      </div>`).join('');

  const hasMore = lastPage != null && page < lastPage;
  const busy = loadingMore || loadingAll;
  let footerHtml = '';
  if (hasMore) {
    const label = loadingMore ? 'Loading…' : loadError ? 'Failed — Retry' : 'Load more';
    footerHtml = `<button class="btn-load-more" id="btn-load-more" ${busy ? 'disabled' : ''}>${escapeHtml(label)}</button>`;
  } else if (lastPage != null) {
    footerHtml = `<p class="end-msg">End of comments &middot; page ${page} of ${lastPage}</p>`;
  }

  const pageLabel = lastPage != null ? ` &middot; page ${page} of ${lastPage}` : '';
  feedEl.innerHTML =
    `<p class="profile-line">Profile: <b>${escapeHtml(username)}</b> &middot; ${comments.length} comments${pageLabel}</p>` +
    rows +
    footerHtml;
}

// The URL box is a separate persistent element (not rewritten by renderList),
// so it just reflects state.comments — one link per comment — whenever
// state changes, however that state got loaded (page 1, Load more, or
// Load all pages).
function renderUrlBox() {
  const { comments, page, lastPage, loadingAll } = state;
  const urls = comments.map((c) => c.postHref).filter(Boolean);
  urlBoxEl.value = urls.join('\n');

  const hasMore = lastPage != null && page < lastPage;

  if (!comments.length) {
    urlStatusEl.textContent = '';
  } else if (loadingAll) {
    urlStatusEl.textContent = `Loading all pages… ${page} of ${lastPage} (${urls.length} links so far)`;
  } else if (hasMore) {
    urlStatusEl.textContent = `${urls.length} links from page 1–${page} of ${lastPage}.`;
  } else {
    urlStatusEl.textContent = `${urls.length} links — all pages loaded.`;
  }

  btnLoadAllEl.disabled = loadingAll || state.loadingMore || !hasMore;
  btnLoadAllEl.textContent = loadingAll ? 'Loading…' : 'Load all pages';
}

async function fetchNextPage() {
  const nextPage = state.page + 1;
  const res = await fetch(`${WORKER_URL}/comments?username=${encodeURIComponent(state.username)}&page=${nextPage}`);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || String(res.status));

  state.comments = state.comments.concat(data.comments || []);
  state.page = data.page || nextPage;
  state.lastPage = data.lastPage != null ? data.lastPage : state.lastPage;
}

async function loadMore() {
  if (state.loadingMore || state.loadingAll || state.lastPage == null || state.page >= state.lastPage) return;

  state.loadingMore = true;
  state.loadError = false;
  renderList();
  renderUrlBox();

  try {
    await fetchNextPage();
  } catch (err) {
    state.loadError = true;
  } finally {
    state.loadingMore = false;
    renderList();
    renderUrlBox();
  }
}

async function loadAllPages() {
  if (state.loadingMore || state.loadingAll || state.lastPage == null) return;

  state.loadingAll = true;
  state.loadError = false;
  renderList();
  renderUrlBox();

  while (state.page < state.lastPage) {
    try {
      await fetchNextPage();
      renderList();
      renderUrlBox();
    } catch (err) {
      state.loadError = true;
      break;
    }
  }

  state.loadingAll = false;
  renderList();
  renderUrlBox();
}

async function lookup() {
  const username = inputEl.value.trim();
  if (!username) {
    renderStatus('Enter a username first.', true);
    return;
  }
  if (WORKER_URL.includes('YOUR-SUBDOMAIN')) {
    renderStatus('Worker not configured yet — deploy ntp-tracker-worker and set WORKER_URL in this page. See ntp-tracker-worker/README.md.', true);
    return;
  }

  btnEl.disabled = true;
  renderStatus('Looking up ' + username + ' …', false);

  try {
    const res = await fetch(`${WORKER_URL}/comments?username=${encodeURIComponent(username)}`);
    const data = await res.json();

    if (!res.ok) {
      if (data.error === 'user_not_found') {
        renderStatus(`No NameThatPorn profile found for "${username}".`, true);
      } else if (data.error === 'invalid_username') {
        renderStatus('That username has characters this tool doesn’t expect.', true);
      } else {
        renderStatus('Lookup failed: ' + (data.error || res.status), true);
      }
      return;
    }

    state = {
      username: data.username,
      page: data.page || 1,
      lastPage: data.lastPage != null ? data.lastPage : null,
      comments: data.comments || [],
      loadingMore: false,
      loadingAll: false,
      loadError: false,
    };
    renderList();
    renderUrlBox();
  } catch (err) {
    renderStatus('Could not reach the worker. Check WORKER_URL and your connection.', true);
  } finally {
    btnEl.disabled = false;
  }
}

document.getElementById('btn-enter').addEventListener('click', () => {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').classList.add('show');
  inputEl.focus();
});
document.getElementById('btn-leave').addEventListener('click', () => { location.href = 'https://google.com'; });

btnEl.addEventListener('click', lookup);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') lookup(); });
feedEl.addEventListener('click', (e) => {
  if (e.target.closest('#btn-load-more')) loadMore();
});

btnLoadAllEl.addEventListener('click', loadAllPages);
btnCopyEl.addEventListener('click', async () => {
  if (!urlBoxEl.value) return;
  try {
    await navigator.clipboard.writeText(urlBoxEl.value);
  } catch (err) {
    urlBoxEl.select();
    document.execCommand('copy');
  }
  const original = btnCopyEl.textContent;
  btnCopyEl.textContent = 'Copied!';
  setTimeout(() => { btnCopyEl.textContent = original; }, 1200);
});

footerEl.innerHTML = 'Data pulled from NameThatPorn.com via a Cloudflare Worker (server-side fetch — see <code>ntp-tracker-worker/</code>). Not affiliated with NameThatPorn.';
</script>
</body>
</html>
