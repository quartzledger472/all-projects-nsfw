<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NTP Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0c10;--bg2:#111419;--bg3:#171b22;
  --teal:#6fb8ac;--teal2:#9ed8cc;
  --teal-dim:rgba(111,184,172,0.08);--teal-mid:rgba(111,184,172,0.25);
  --text:#eef1f0;--text2:#8b9490;--text3:#454c56;
  --border:rgba(255,255,255,0.06);--border2:rgba(111,184,172,0.2);
  --red:#c06868;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Jost',sans-serif;}
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;}
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity:0.035;pointer-events:none;z-index:0;
}
.back{position:fixed;top:1.1rem;left:1.25rem;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:0.14em;color:var(--text3);text-decoration:none;z-index:101;}
.back:hover{color:var(--teal);}

/* Gate */
#gate{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:2rem;text-align:center;}
.gate-glyph{font-size:40px;margin-bottom:1.25rem;opacity:0.4;color:var(--teal);}
#gate h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:400;color:var(--text);margin-bottom:0.5rem;letter-spacing:0.04em;}
#gate p{font-size:13px;color:var(--text2);line-height:1.7;max-width:300px;margin:0 auto 2rem;}
.gate-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px;}
.btn-enter{padding:14px;background:var(--teal);color:#0a0c10;border:none;font-family:'Jost',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;border-radius:1px;}
.btn-leave{padding:14px;background:transparent;color:var(--text2);border:1px solid var(--border);font-family:'Jost',sans-serif;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;border-radius:1px;}

/* App */
#app{display:none;flex-direction:column;width:100%;height:100%;max-width:520px;position:relative;z-index:1;flex:1;}
#app.show{display:flex;}

header{padding:1.25rem 1.5rem 1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
.logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:400;font-style:italic;color:var(--teal);letter-spacing:0.04em;}
.header-sub{font-size:10px;letter-spacing:0.16em;color:var(--text3);text-transform:uppercase;}

/* Search */
.search-bar{padding:1rem 1.5rem;display:flex;gap:8px;border-bottom:1px solid var(--border);flex-shrink:0;}
.search-input{
  flex:1;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);
  border-radius:2px;color:var(--text);font-family:'Jost',sans-serif;font-size:13px;
  letter-spacing:0.02em;outline:none;
}
.search-input::placeholder{color:var(--text3);}
.search-input:focus{border-color:var(--border2);}
.btn-search{
  flex-shrink:0;padding:12px 18px;background:var(--teal);color:#0a0c10;border:none;
  font-family:'Jost',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.1em;
  text-transform:uppercase;cursor:pointer;border-radius:2px;
}
.btn-search:disabled{opacity:0.5;cursor:default;}

/* Main feed area */
.main{flex:1;overflow-y:auto;padding:1.25rem 1.5rem 2rem;display:flex;flex-direction:column;gap:0.75rem;}

.hint{font-size:12px;color:var(--text3);line-height:1.7;text-align:center;padding:2.5rem 1rem;}
.hint b{color:var(--teal);font-weight:500;}

.status-msg{font-size:12px;color:var(--text2);text-align:center;padding:2.5rem 1rem;letter-spacing:0.03em;}
.status-msg.error{color:var(--red);}

.profile-line{
  font-size:11px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;
  padding-bottom:0.25rem;
}
.profile-line b{color:var(--teal2);text-transform:none;letter-spacing:0.02em;font-weight:500;}

/* Activity cards */
.item{
  background:var(--bg3);border:1px solid var(--border);border-radius:3px;
  padding:0.9rem 1.1rem;display:flex;flex-direction:column;gap:0.4rem;
}
.item-top{display:flex;align-items:center;gap:8px;}
.badge{
  font-size:9px;letter-spacing:0.1em;text-transform:uppercase;font-weight:500;
  padding:3px 8px;border-radius:999px;border:1px solid var(--border2);color:var(--teal2);
  flex-shrink:0;
}
.badge.correct-answer{border-color:rgba(111,184,172,0.35);color:var(--teal2);}
.badge.comment{border-color:rgba(200,169,126,0.35);color:#c8a97e;}
.badge.level-up{border-color:rgba(196,168,224,0.35);color:#c4a8e0;}
.badge.helpful-confirm,.badge.helpful-vote{border-color:var(--border2);color:var(--text2);}
.badge.other{border-color:var(--border);color:var(--text3);}
.points{font-size:11px;color:var(--teal2);font-weight:500;margin-left:auto;}
.ago{font-size:10px;color:var(--text3);letter-spacing:0.04em;flex-shrink:0;margin-left:auto;}
.item-top .ago{margin-left:0;}
.item-text{font-size:13px;color:var(--text);line-height:1.55;}

footer{
  padding:0.9rem 1.5rem 1.25rem;border-top:1px solid var(--border);flex-shrink:0;
  font-size:10px;color:var(--text3);letter-spacing:0.04em;text-align:center;line-height:1.6;
}
footer code{color:var(--teal2);font-family:monospace;}

@media (max-width:520px){
  #app{max-width:100%;}
}
</style>
</head>
<body>

<a class="back" href="../">&#9664; INDEX</a>

<div id="gate">
  <div class="gate-glyph">◈</div>
  <h1>NTP Tracker</h1>
  <p>Look up a NameThatPorn.com profile's activity feed. Pulls user-submitted comments and activity from an adult trivia site — 18+.</p>
  <div class="gate-btns">
    <button class="btn-enter" id="btn-enter">I'm 18+ — Enter</button>
    <button class="btn-leave" id="btn-leave">Leave</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">NTP Tracker</div>
    <div class="header-sub">Activity Feed</div>
  </header>

  <div class="search-bar">
    <input class="search-input" id="username-input" type="text" placeholder="NameThatPorn username" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn-search" id="btn-search">Look Up</button>
  </div>

  <div class="main" id="feed">
    <p class="hint">Enter a username above — e.g. <b>redcollar1275</b> — to pull their recent activity and comments.</p>
  </div>

  <footer id="footer-note"></footer>
</div>

<script>
// Set this to your deployed worker's URL after running `npx wrangler deploy`
// in ntp-tracker-worker/. See that folder's README.md.
const WORKER_URL = 'https://ntp-tracker-worker.YOUR-SUBDOMAIN.workers.dev';

const feedEl = document.getElementById('feed');
const inputEl = document.getElementById('username-input');
const btnEl = document.getElementById('btn-search');
const footerEl = document.getElementById('footer-note');

const TYPE_LABELS = {
  'correct-answer': 'Correct Answer',
  'comment': 'Comment',
  'level-up': 'Level Up',
  'helpful-confirm': 'Confirm',
  'helpful-vote': 'Vote',
  'other': 'Activity'
};

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderStatus(msg, isError) {
  feedEl.innerHTML = `<p class="status-msg${isError ? ' error' : ''}">${escapeHtml(msg)}</p>`;
}

function renderActivity(username, activity) {
  if (!activity.length) {
    feedEl.innerHTML =
      `<p class="profile-line">Profile: <b>${escapeHtml(username)}</b></p>` +
      `<p class="status-msg">No activity found on this page.</p>`;
    return;
  }

  const rows = activity.map((item) => {
    const label = TYPE_LABELS[item.type] || TYPE_LABELS.other;
    const points = item.pointsDelta != null
      ? `<span class="points">+${item.pointsDelta} pts</span>`
      : '';
    return `
      <div class="item">
        <div class="item-top">
          <span class="badge ${escapeHtml(item.type)}">${escapeHtml(label)}</span>
          ${points}
          <span class="ago">${escapeHtml(item.ago || '')}</span>
        </div>
        <div class="item-text">${escapeHtml(item.text)}</div>
      </div>`;
  }).join('');

  feedEl.innerHTML =
    `<p class="profile-line">Profile: <b>${escapeHtml(username)}</b> &middot; ${activity.length} items</p>` +
    rows;
}

async function lookup() {
  const username = inputEl.value.trim();
  if (!username) {
    renderStatus('Enter a username first.', true);
    return;
  }
  if (WORKER_URL.includes('YOUR-SUBDOMAIN')) {
    renderStatus('Worker not configured yet — deploy ntp-tracker-worker and set WORKER_URL in this page. See ntp-tracker-worker/README.md.', true);
    return;
  }

  btnEl.disabled = true;
  renderStatus('Looking up ' + username + ' …', false);

  try {
    const res = await fetch(`${WORKER_URL}/activity?username=${encodeURIComponent(username)}`);
    const data = await res.json();

    if (!res.ok) {
      if (data.error === 'user_not_found') {
        renderStatus(`No NameThatPorn profile found for "${username}".`, true);
      } else if (data.error === 'invalid_username') {
        renderStatus('That username has characters this tool doesn’t expect.', true);
      } else {
        renderStatus('Lookup failed: ' + (data.error || res.status), true);
      }
      return;
    }

    renderActivity(data.username, data.activity || []);
  } catch (err) {
    renderStatus('Could not reach the worker. Check WORKER_URL and your connection.', true);
  } finally {
    btnEl.disabled = false;
  }
}

document.getElementById('btn-enter').addEventListener('click', () => {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').classList.add('show');
  inputEl.focus();
});
document.getElementById('btn-leave').addEventListener('click', () => { location.href = 'https://google.com'; });

btnEl.addEventListener('click', lookup);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') lookup(); });

footerEl.innerHTML = 'Data pulled from NameThatPorn.com profile pages via a Cloudflare Worker (server-side fetch — see <code>ntp-tracker-worker/</code>). Not affiliated with NameThatPorn.';
</script>
</body>
</html>
