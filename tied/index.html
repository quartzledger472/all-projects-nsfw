<style>

:root{

html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Jost',sans-serif;overflow:hidden;}

.gate-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px;}

#app.show{display:flex;}

header{padding:1.25rem 1.5rem 0;flex-shrink:0;}

.logo-sub{font-size:10px;letter-spacing:0.18em;color:var(--text3);text-transform:uppercase;margin-top:2px;}

/* Mode tabs */
.mode-tabs{display:flex;padding:1rem 1.5rem 0;gap:0;flex-shrink:0;}
.mode-tab{

}
.mode-tab.active{color:var(--rose);border-bottom:1px solid var(--rose);}

/* Screens */

.screen.active{display:flex;}

/* ── RANDOMISE SCREEN ── */

.dice-card{

}
.dice-card.rolled{border-color:var(--border2);}
.die-wrap{flex-shrink:0;width:56px;height:56px;perspective:180px;}
.die{width:56px;height:56px;position:relative;transform-style:preserve-3d;transform:rotateX(0deg) rotateY(0deg);}
.die.rolling{animation:roll 0.7s ease-out forwards;}
@keyframes roll{

  25%{transform:rotateX(180deg) rotateY(90deg);}
  50%{transform:rotateX(360deg) rotateY(200deg);}
  75%{transform:rotateX(280deg) rotateY(340deg);}
  100%{transform:rotateX(var(--rx)) rotateY(var(--ry));}
}
.face{position:absolute;width:56px;height:56px;background:var(--bg2);border:1px solid var(--border2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:18px;backface-visibility:hidden;}
.face-front{transform:translateZ(28px);}
.face-back{transform:rotateY(180deg) translateZ(28px);}
.face-right{transform:rotateY(90deg) translateZ(28px);}
.face-left{transform:rotateY(-90deg) translateZ(28px);}
.face-top{transform:rotateX(90deg) translateZ(28px);}
.face-bottom{transform:rotateX(-90deg) translateZ(28px);}

.dice-card.rolled .dice-result{color:var(--text);}
.dice-reroll{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:transparent;border:1px solid var(--border2);color:var(--rose);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s;}
.dice-reroll:hover{background:var(--rose-dim);}
.dice-reroll:active{transform:scale(0.9);}

.rand-bottom{padding:1rem 1.5rem 1.5rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px;flex-shrink:0;}
.btn-roll{width:100%;padding:14px;background:var(--rose);color:#0f0d0e;border:none;font-family:'Jost',sans-serif;font-size:12px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer;border-radius:1px;transition:opacity 0.2s,transform 0.1s;}
.btn-roll:active{transform:scale(0.98);}
.btn-reveal-rand{width:100%;padding:13px;background:transparent;color:var(--rose);border:1px solid var(--border2);font-family:'Jost',sans-serif;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;border-radius:1px;opacity:0;transition:opacity 0.3s;pointer-events:none;}
.btn-reveal-rand.visible{opacity:1;pointer-events:auto;}

/* Reveal overlay */

.reveal-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;font-style:italic;color:var(--rose);text-align:center;}
.reveal-sub{font-size:11px;color:var(--text3);letter-spacing:0.12em;text-align:center;text-transform:uppercase;}
.reveal-item{width:100%;max-width:380px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:1rem 1.25rem;opacity:0;transform:translateY(10px);transition:all 0.35s;}

.reveal-item-label{font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text3);}
.reveal-item-val{font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;color:var(--text);margin-top:4px;line-height:1.4;}
.reveal-tip{width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--border2);border-radius:3px;padding:1.25rem;opacity:0;transform:translateY(10px);transition:all 0.4s;}

.reveal-tip-label{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--rose);margin-bottom:0.6rem;}

.btn-back-reveal{width:100%;padding:14px;background:transparent;color:var(--text2);border:1px solid var(--border);font-family:'Jost',sans-serif;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;border-radius:1px;}

.explore-filters{padding:1rem 1.5rem;display:flex;gap:6px;flex-shrink:0;border-bottom:1px solid var(--border);}

.detail-header{padding:1.5rem 1.5rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0;}

</style>

    warning: 'Never wrap rope around the throat or neck. Check regularly that the chest can expand fully for normal breathing. If your partner says anything feels tight in their chest or they feel short of breath, remove immediately.'
  },
  {
    id: 'wrists-to-ankles',
    name: 'Wrists to Ankles',
    level: 'intermediate',
    desc: 'The wrists are bound to the ankles, pulling the body into a compact, fully exposed position. A step up from basic restraints — more restrictive and more vulnerable.',
    needs: ['Rope or long restraints', 'Comfortable surface'],
    how: 'Have your partner lie on their back with knees bent up toward the chest. Bind wrists and ankles together — either same side (right wrist to right ankle) or crossed. The position naturally curves the body and creates full exposure. A pillow under the lower back helps.',
    tips: 'Check that the position isn\'t straining the lower back. This works better for shorter, more intense sessions than extended play. The vulnerability of the position means checking in frequently is especially important.',
    warning: 'This position strains the lower back and hip flexors over time. Build in regular breaks and never leave someone in this position unattended.'
  },
  {
    id: 'standing-bound',
    name: 'Standing & Bound',
    level: 'intermediate',
    desc: 'The partner stands with wrists secured above them to an anchor point — a door frame, ceiling hook, or held post. Combines exposure with physical tension in a way lying positions don\'t.',
    needs: ['Overhead anchor point', 'Rope or cuffs', 'Something to stand on if needed'],
    how: 'Secure the wrists together first, then raise them above the head and attach to your anchor point. The arms should be raised but not straining — slightly bent is fine. The feet should be flat on the floor. Door frame hooks or over-door restraint anchors work well for this.',
    tips: 'The standing position creates a different kind of vulnerability — the person can\'t sink into a surface or shift their weight easily. Combining with a blindfold works particularly well here.',
    warning: 'Never secure so that the person is on their tiptoes or bearing weight through their wrists. They need to be able to stand flat-footed comfortably. Have them sit or lie down immediately if they feel dizzy or faint.'
  }
];

// ── STATE ─────────────────────────────────────────────
const FACE_ROTS = [
  {rx:'0deg',ry:'0deg'},{rx:'0deg',ry:'180deg'},
  {rx:'0deg',ry:'-90deg'},{rx:'0deg',ry:'90deg'},
  {rx:'-90deg',ry:'0deg'},{rx:'90deg',ry:'0deg'}
];
let results = {};
let currentFilter = 'all';

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ── INIT ──────────────────────────────────────────────
function enterApp(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').classList.add('show');
  buildDice();
  buildExplore();
}

// ── TABS ──────────────────────────────────────────────
function switchTab(tab){
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.getElementById(`screen-${tab}`).classList.add('active');
}

// ── RANDOMISE ─────────────────────────────────────────
function buildDice(){
  const area = document.getElementById('dice-area');
  area.innerHTML = '';
  area.style.cssText = 'flex:1;overflow-y:auto;padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:0.875rem;';
  DICE_CATEGORIES.forEach(cat => {
    const card = document.createElement('div');
    card.className = 'dice-card';
    card.id = `card-${cat.id}`;
    card.innerHTML = `
      <div class="die-wrap">
        <div class="die" id="die-${cat.id}" style="--rx:0deg;--ry:0deg;">
          <div class="face face-front">${cat.icon}</div>
          <div class="face face-back">${cat.icon}</div>
          <div class="face face-right">${cat.icon}</div>
          <div class="face face-left">${cat.icon}</div>
          <div class="face face-top">${cat.icon}</div>
          <div class="face face-bottom">${cat.icon}</div>
        </div>
      </div>
      <div class="dice-info">
        <div class="dice-label">${cat.label}</div>
        <div class="dice-result" id="result-${cat.id}">Tap ↻ to roll</div>
      </div>
      <button class="dice-reroll" data-id="${cat.id}" aria-label="Roll ${cat.label}">↻</button>
    `;
    area.appendChild(card);
  });
  area.querySelectorAll('.dice-reroll').forEach(btn => {
    btn.addEventListener('click', () => rollOne(btn.dataset.id));
  });
}

function rollOne(id){
  const cat = DICE_CATEGORIES.find(c => c.id === id);
  const die = document.getElementById(`die-${id}`);
  const resultEl = document.getElementById(`result-${id}`);
  const card = document.getElementById(`card-${id}`);
  const winner = pick(cat.items);
  results[id] = winner;
  const rot = pick(FACE_ROTS);
  die.style.setProperty('--rx', rot.rx);
  die.style.setProperty('--ry', rot.ry);
  die.classList.remove('rolling');
  void die.offsetWidth;
  die.classList.add('rolling');
  setTimeout(() => {
    resultEl.textContent = winner;
    card.classList.add('rolled');
    checkAllRolled();
  }, 680);
}

function rollAll(){
  results = {};
  document.getElementById('btn-reveal-rand').classList.remove('visible');
  DICE_CATEGORIES.forEach((cat, i) => {
    setTimeout(() => rollOne(cat.id), i * 130);
  });
}

function checkAllRolled(){
  if(DICE_CATEGORIES.every(c => results[c.id])){
    document.getElementById('btn-reveal-rand').classList.add('visible');
  }
}

function showReveal(){
  document.getElementById('reveal').classList.add('show');
  const itemsEl = document.getElementById('reveal-items');
  itemsEl.innerHTML = '';
  DICE_CATEGORIES.forEach((cat, i) => {
    const val = results[cat.id] || pick(cat.items);
    const d = document.createElement('div');
    d.className = 'reveal-item';
    d.innerHTML = `<div class="reveal-item-label">${cat.icon} ${cat.label}</div><div class="reveal-item-val">${val}</div>`;
    itemsEl.appendChild(d);
    setTimeout(() => d.classList.add('show'), i * 100 + 50);
  });
  const tipData = {
    position: results.position || pick(DICE_CATEGORIES[0].items),
    restraint: results.restraint || pick(DICE_CATEGORIES[1].items),
    sensory: results.sensory || pick(DICE_CATEGORIES[2].items),
    activity: results.activity || pick(DICE_CATEGORIES[3].items)
  };
  document.getElementById('reveal-tip-text').textContent = pick(TIPS)(tipData);
  const tipEl = document.getElementById('reveal-tip');
  setTimeout(() => tipEl.classList.add('show'), DICE_CATEGORIES.length * 100 + 150);
}

function closeReveal(){
  document.getElementById('reveal').classList.remove('show');
  document.getElementById('reveal-tip').classList.remove('show');
}

function startOver(){
  results = {};
  closeReveal();
  document.getElementById('btn-reveal-rand').classList.remove('visible');
  buildDice();
}

// ── EXPLORE ───────────────────────────────────────────
function buildExplore(filter){
  filter = filter || currentFilter;
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === filter);
  });
  const list = document.getElementById('explore-list');
  list.innerHTML = '';
  const items = filter === 'all' ? EXPLORE_ITEMS : EXPLORE_ITEMS.filter(i => i.level === filter);
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'explore-card';
    card.innerHTML = `
      <div class="explore-card-top">
        <div class="explore-card-name">${item.name}</div>
        <div class="explore-card-level ${item.level}">${item.level}</div>
      </div>
      <div class="explore-card-desc">${item.desc.substring(0, 90)}...</div>
      <div class="explore-card-tags">
        ${item.needs.slice(0,3).map(n => `<span class="explore-tag">${n}</span>`).join('')}
      </div>
    `;
    card.addEventListener('click', () => showDetail(item));
    list.appendChild(card);
  });
}

function showDetail(item){
  document.getElementById('detail-name').textContent = item.name;
  const levelEl = document.getElementById('detail-level');
  levelEl.textContent = item.level;
  levelEl.className = `detail-level ${item.level}`;
  document.getElementById('detail-desc').textContent = item.desc;
  document.getElementById('detail-how').textContent = item.how;
  document.getElementById('detail-tips').textContent = item.tips;
  const needsEl = document.getElementById('detail-needs');
  needsEl.innerHTML = item.needs.map(n => `<span class="detail-need">${n}</span>`).join('');
  const warnWrap = document.getElementById('detail-warning-wrap');
  if(item.warning){
    document.getElementById('detail-warning').textContent = item.warning;
    warnWrap.style.display = 'block';
  } else {
    warnWrap.style.display = 'none';
  }
  document.getElementById('detail').classList.add('show');
  document.getElementById('detail').scrollTop = 0;
}

function closeDetail(){
  document.getElementById('detail').classList.remove('show');
}

// ── WIRE UP ───────────────────────────────────────────
document.getElementById('btn-enter').addEventListener('click', enterApp);
document.getElementById('btn-leave').addEventListener('click', () => { location.href = 'https://google.com'; });
document.getElementById('btn-roll').addEventListener('click', rollAll);
document.getElementById('btn-reveal-rand').addEventListener('click', showReveal);
document.getElementById('btn-again').addEventListener('click', startOver);
document.getElementById('btn-back-reveal').addEventListener('click', closeReveal);
document.getElementById('tab-randomise').addEventListener('click', () => switchTab('randomise'));
document.getElementById('tab-explore').addEventListener('click', () => switchTab('explore'));
document.getElementById('detail-back').addEventListener('click', closeDetail);
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => buildExplore(btn.dataset.filter));
});
</script>
</body>
</html>
