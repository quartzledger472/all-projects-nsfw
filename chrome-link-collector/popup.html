<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Link Collector</title>
<style>
  body { width: 360px; font-family: sans-serif; padding: 10px; }
  button { padding: 6px 10px; margin-right: 6px; cursor: pointer; }
  textarea { width: 100%; height: 220px; margin-top: 10px; box-sizing: border-box; font-size: 12px; }
  #status { font-size: 12px; color: #555; margin-top: 6px; }
  label { font-size: 12px; }
</style>
</head>
<body>
  <div>
    <button id="collect">Collect Links</button>
    <button id="copy">Copy All</button>
  </div>
  <div>
    <label><input type="checkbox" id="dedupe" checked> Remove duplicates</label>
  </div>
  <textarea id="output" placeholder="Links will appear here..." readonly></textarea>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
