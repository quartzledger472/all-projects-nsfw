<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Index of Projects</title>
  <meta name="description" content="A running list of things I've built." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #14161c;
      --surface:  #1b1e26;
      --border:   #2b2f3a;
      --text:     #eceef2;
      --muted:    #828997;
      --accent:   #8b95ff;
      --accent-hi:#aeb5ff;
      --mono:    "Space Mono", ui-monospace, Menlo, monospace;
      --display: "Space Grotesk", system-ui, sans-serif;
      --sans:    system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.5;
      background-image: radial-gradient(110% 70% at 100% -10%, rgba(139,149,255,0.10), transparent 55%);
      background-attachment: fixed;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: clamp(2.5rem, 8vw, 5.5rem) 1.25rem 4rem;
    }

    /* ---- header ---- */
    .eyebrow {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 1.2rem;
    }
    h1 {
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(2.1rem, 7vw, 3.4rem);
      line-height: 1.03;
      letter-spacing: -0.02em;
      margin: 0 0 0.8rem;
    }
    .lede {
      color: var(--muted);
      max-width: 48ch;
      margin: 0;
      font-size: 1.02rem;
    }
    .count {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin: 2rem 0 0;
    }
    .count b { color: var(--text); font-weight: 700; }

    /* ---- index list ---- */
    .index {
      list-style: none;
      margin: 0.5rem 0 0;
      padding: 0;
      border-top: 1px solid var(--border);
    }
    .entry {
      display: block;
      padding: 1.35rem 0.4rem 1.4rem;
      border-bottom: 1px solid var(--border);
      color: inherit;
      text-decoration: none;
      transition: padding-left 0.15s ease, background 0.15s ease;
    }
    .entry:hover, .entry:focus-visible {
      background: var(--surface);
      padding-left: 0.9rem;
      outline: none;
    }
    .entry:focus-visible { box-shadow: inset 3px 0 0 var(--accent); }

    .entry__top {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }
    .entry__num {
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--muted);
      min-width: 2.4ch;
    }
    .entry:hover .entry__num, .entry:focus-visible .entry__num { color: var(--accent); }

    .entry__title {
      font-family: var(--display);
      font-weight: 500;
      font-size: 1.25rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry:hover .entry__title, .entry:focus-visible .entry__title { color: var(--accent-hi); }

    .entry__leader {
      flex: 1 1 auto;
      border-bottom: 1px dotted var(--border);
      transform: translateY(-0.25em);
      min-width: 1.5rem;
    }

    .entry__meta {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      flex: none;
    }
    .tag {
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.15rem 0.6rem;
    }
    .entry:hover .tag, .entry:focus-visible .tag { border-color: var(--accent); color: var(--accent-hi); }
    .year { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }

    .entry__desc {
      color: var(--muted);
      font-size: 0.92rem;
      margin: 0.4rem 0 0;
      padding-left: calc(2.4ch + 0.75rem);
    }

    /* ---- empty state ---- */
    .empty {
      padding: 2.75rem 1.5rem;
      text-align: center;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .empty code {
      font-family: var(--mono);
      color: var(--accent);
      background: var(--surface);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }

    footer {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .entry__top { flex-wrap: wrap; }
      .entry__leader { display: none; }
      .entry__meta { width: 100%; padding-left: calc(2.4ch + 0.75rem); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Projects · Index</p>
    <h1>Things I've built</h1>
    <p class="lede">A running list of small tools, games, and experiments. Newest first — pick one and have a look.</p>

    <ul class="index" id="index"></ul>
    <p class="count" id="count"></p>
  </main>

  <footer>
    <span id="year"></span> · built for fun
  </footer>

  <!-- The list of projects lives in projects.js as window.PROJECTS. Add one there. -->
  <script src="projects.js"></script>
  <script>
    (function () {
      var list = document.getElementById("index");
      var count = document.getElementById("count");
      document.getElementById("year").textContent = new Date().getFullYear();

      var items = Array.isArray(window.PROJECTS) ? window.PROJECTS.slice() : [];

      // Newest first when an "added" date is present; otherwise keep file order.
      items.sort(function (a, b) {
        if (a.added && b.added) return a.added < b.added ? 1 : a.added > b.added ? -1 : 0;
        return 0;
      });

      if (items.length === 0) {
        list.innerHTML =
          '<li class="empty">No projects yet. Add your first one to <code>projects.js</code>.</li>';
        count.textContent = "";
        return;
      }

      items.forEach(function (p, i) {
        var num = String(i + 1).padStart(2, "0");
        var href = p.href || "./" + p.slug + "/";
        var year = p.added ? String(p.added).slice(0, 4) : "";

        var a = document.createElement("a");
        a.className = "entry";
        a.href = href;
        a.innerHTML =
          '<span class="entry__top">' +
            '<span class="entry__num">' + num + "</span>" +
            '<span class="entry__title"></span>' +
            '<span class="entry__leader" aria-hidden="true"></span>' +
            '<span class="entry__meta">' +
              (p.type ? '<span class="tag"></span>' : "") +
              (year ? '<span class="year">' + year + "</span>" : "") +
            "</span>" +
          "</span>" +
          '<span class="entry__desc"></span>';

        // Set user text with textContent so it can't inject markup.
        a.querySelector(".entry__title").textContent = p.title || p.slug || "Untitled";
        a.querySelector(".entry__desc").textContent = p.description || "";
        if (p.type) a.querySelector(".tag").textContent = p.type;

        var li = document.createElement("li");
        li.appendChild(a);
        list.appendChild(li);
      });

      count.innerHTML = "<b>" + items.length + "</b> " + (items.length === 1 ? "project" : "projects");
    })();
  </script>
</body>
</html>
